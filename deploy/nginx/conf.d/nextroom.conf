# NextRoom reverse proxy
# server_name 기준으로 live / dev 컨테이너로 라우팅.
# 인증서는 acme.sh(ZeroSSL)가 /etc/nginx/certs 로 발급 (컨테이너에 ./nginx/certs 마운트).
# 도메인은 실제 운영 값으로 반드시 수정할 것 (TODO).

# ---- 공통: ACME HTTP-01 챌린지 + HTTPS 리다이렉트 ----
server {
    listen 80;
    listen [::]:80;
    server_name api.nextroom.co.kr api-dev.nextroom.co.kr;   # TODO: 실제 백엔드 도메인으로 수정

    # acme.sh --webroot 방식 사용 시 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- LIVE ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.nextroom.co.kr;   # TODO: 실제 운영(live) 백엔드 도메인

    ssl_certificate     /etc/nginx/certs/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/privkey.pem;

    client_max_body_size 20m;

    # ── actuator 노출 제한 ──
    # health 만 공개(UptimeRobot 외부 감시용). prometheus 등 내부 지표는 외부 차단.
    # (Alloy 는 nginx 를 거치지 않고 docker 네트워크로 직접 수집하므로 영향 없음)
    location = /actuator/health {
        proxy_pass http://spring-live:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://spring-live:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

