# NextRoom 운영 스택 (VM 1대에 전체 통합)
#
# 실행:  cd deploy && docker compose pull && docker compose up -d
# 필요 파일(서버에만 존재, git 커밋 금지):
#   deploy/.env                 (compose 인터폴레이션: 이미지 태그, MySQL root/계정 비밀번호)
#   deploy/.env.live            (spring-live 앱 환경변수, prod 프로필)
#   deploy/.env.dev             (spring-dev  앱 환경변수, dev  프로필)
#   deploy/secrets/iap-google-credentials.json  (Google IAP 크레덴셜)
#   deploy/nginx/certs/         (acme.sh 가 발급한 ZeroSSL 인증서)

name: nextroom

# 컨테이너 로그 로테이션 (미설정 시 json 로그가 무한히 커져 디스크를 잠식)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nextroom-nginx
    logging: *default-logging
    # OOM 시 피해를 이 컨테이너로 한정 (미설정 시 호스트 OOM killer가 MySQL을 죽일 수 있음)
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # acme.sh(host)가 쓰는 webroot 와 동일 경로를 서빙해야 HTTP-01 갱신이 동작한다.
      # (named volume 이 아니라 host bind mount 로 일치시킴)
      - ./nginx/acme-webroot:/var/www/acme:ro
    depends_on:
      - spring-live
      - spring-dev
    networks:
      - nextroom

  spring-live:
    image: ghcr.io/next-room/nextroom-be:${LIVE_TAG:-live}
    container_name: nextroom-spring-live
    logging: *default-logging
    # OOM 시 피해를 이 컨테이너로 한정 (미설정 시 호스트 OOM killer가 MySQL을 죽일 수 있음)
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - ./.env.live
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 힙 캡. 미설정 시 960m 까지 늘어남. 컨테이너 제한(1g)보다 낮게 둬
      # cgroup SIGKILL 대신 Java OutOfMemoryError 로 로그에 남게 한다.
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - ./secrets/iap-google-credentials.json:/app/config/iap-google-credentials.json:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextroom

  spring-dev:
    image: ghcr.io/next-room/nextroom-be:${DEV_TAG:-dev}
    container_name: nextroom-spring-dev
    logging: *default-logging
    # OOM 시 피해를 이 컨테이너로 한정 (미설정 시 호스트 OOM killer가 MySQL을 죽일 수 있음)
    mem_limit: 768m
    restart: unless-stopped
    env_file:
      - ./.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_OPTS: "-Xmx384m"
    volumes:
      - ./secrets/iap-google-credentials.json:/app/config/iap-google-credentials.json:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextroom

  mysql:
    image: mysql:8.0
    container_name: nextroom-mysql
    logging: *default-logging
    # OOM 시 피해를 이 컨테이너로 한정 (미설정 시 호스트 OOM killer가 MySQL을 죽일 수 있음)
    mem_limit: 1g
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in deploy/.env}
      # 앱 계정/스키마는 ./mysql/init 스크립트에서 생성 (아래 변수 사용)
      APP_DB_USER: ${APP_DB_USER:?set in deploy/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in deploy/.env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 컨테이너 외부(호스트)에서 mysqldump/복원할 때만 임시로 포트를 열 것. 평시엔 미노출.
    networks:
      - nextroom

  redis:
    image: redis:7-alpine
    container_name: nextroom-redis
    logging: *default-logging
    # OOM 시 피해를 이 컨테이너로 한정 (미설정 시 호스트 OOM killer가 MySQL을 죽일 수 있음)
    mem_limit: 256m
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nextroom

volumes:
  mysql-data:
  redis-data:

networks:
  nextroom:
    driver: bridge
